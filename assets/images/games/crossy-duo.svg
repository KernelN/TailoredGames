<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- ==========================================
         1. ENVIRONMENT & LIGHTING (DARK TECH-STUDIO)
         ========================================== -->
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060A12" />
      <stop offset="55%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#162238" />
    </linearGradient>

    <!-- Lane Floor Gradients -->
    <linearGradient id="laneGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="laneRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="laneWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>

    <!-- P1 (Cyan) & P2 (Amber) Zone Overlays -->
    <linearGradient id="p1TouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="p2TouchGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shared Duo Hero Suit (Split Cyan / Amber) -->
    <linearGradient id="duoSuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Vehicle Gradients -->
    <linearGradient id="carOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="carPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Shadows & Glow Filters -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="neonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ========================================================
         REUSABLE PROPS
         ======================================================== -->
    <g id="cyber-car-down" filter="url(#dropShadow)">
      <rect x="-18" y="-32" width="36" height="64" rx="8" fill="url(#carOrange)" stroke="#7C2D12" stroke-width="2" />
      <rect x="-13" y="-12" width="26" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <path d="M -11,14 L 11,14 L 8,24 L -8,24 Z" fill="#38BDF8" opacity="0.85" />
      <circle cx="-10" cy="30" r="3" fill="#FEF08A" filter="url(#neonGlow)" />
      <circle cx="10" cy="30" r="3" fill="#FEF08A" filter="url(#neonGlow)" />
    </g>

    <g id="cyber-car-up" filter="url(#dropShadow)">
      <rect x="-18" y="-32" width="36" height="64" rx="8" fill="url(#carPurple)" stroke="#581C87" stroke-width="2" />
      <rect x="-13" y="-14" width="26" height="26" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <path d="M -11,-14 L 11,-14 L 8,-24 L -8,-24 Z" fill="#38BDF8" opacity="0.85" />
      <circle cx="-10" cy="-30" r="3" fill="#FEF08A" filter="url(#neonGlow)" />
      <circle cx="10" cy="-30" r="3" fill="#FEF08A" filter="url(#neonGlow)" />
    </g>

    <g id="energy-raft" filter="url(#dropShadow)">
      <rect x="-24" y="-38" width="48" height="76" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
      <line x1="-18" y1="-20" x2="18" y2="-20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="-18" y1="20" x2="18" y2="20" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="8" fill="#0891B2" stroke="#67E8F9" stroke-width="1.5" />
    </g>

    <!-- SHARED DUO CHARACTER (Controlled Bilaterally!) -->
    <g id="shared-duo-hero" filter="url(#dropShadow)">
      <ellipse cx="0" cy="18" rx="20" ry="7.5" fill="rgba(0,0,0,0.5)" />
      <!-- Half Cyan / Half Amber Suit -->
      <rect x="-14" y="-10" width="28" height="26" rx="9" fill="url(#duoSuit)" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Dual Chest Badges (P1 Cyan / P2 Amber) -->
      <circle cx="-5" cy="3" r="3" fill="#38BDF8" />
      <circle cx="5" cy="3" r="3" fill="#FBBF24" />
      <!-- Head with Dual Visor -->
      <rect x="-16" y="-30" width="32" height="22" rx="10" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.8" />
      <rect x="-13" y="-25" width="26" height="12" rx="5" fill="#0F172A" />
      <!-- Left Eye Cyan, Right Eye Amber -->
      <circle cx="-5" cy="-19" r="2.2" fill="#38BDF8" />
      <circle cx="5" cy="-19" r="2.2" fill="#FBBF24" />
      <!-- Dual Cap -->
      <path d="M -17,-23 C -17,-34 17,-34 17,-23 Z" fill="url(#duoSuit)" stroke="#FFFFFF" stroke-width="1" />
      <rect x="-19" y="-24" width="38" height="3" rx="1.5" fill="#6366F1" />
      <!-- Legs -->
      <rect x="-10" y="14" width="6" height="7" rx="2" fill="#0F172A" />
      <rect x="4" y="14" width="6" height="7" rx="2" fill="#0F172A" />
    </g>
  </defs>

  <!-- ==========================================
       BACKGROUND & STAGE
       ========================================== -->
  <rect width="800" height="500" fill="url(#wallBg)" />

  <!-- ========================================================
       VERTICAL LANES RUNNING TOP-TO-BOTTOM
       (NO central hand-off zone! Seamless continuous obstacle field)
       ======================================================== -->
  <g id="vertical-lanes" transform="translate(60, 65)">
    <!-- Lane 1: Safe Boundary Left (x=0) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="400" rx="4" fill="url(#laneGrass)" stroke="#065F46" stroke-width="2" />
      <line x1="68" y1="0" x2="68" y2="400" stroke="#10B981" stroke-width="2" filter="url(#neonGlow)" />
    </g>

    <!-- Lane 2: Cyber Highway 1 (Vertical Traffic: Top -> Down) -->
    <g transform="translate(75, 0)">
      <rect x="0" y="0" width="95" height="400" rx="4" fill="url(#laneRoad)" stroke="#1E293B" stroke-width="2" />
      <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="16 16" opacity="0.4">
        <line x1="47" y1="0" x2="47" y2="400" />
      </g>
      <use href="#cyber-car-down" x="47" y="110" />
      <use href="#cyber-car-down" x="47" y="320" />
    </g>

    <!-- Lane 3: Laser Obstacle Lane (Vertical Barriers) -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="80" height="400" rx="4" fill="#111827" stroke="#1E293B" stroke-width="2" />
      <line x1="40" y1="0" x2="40" y2="400" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />
      <g transform="translate(40, 80)">
        <rect x="-35" y="-6" width="70" height="12" rx="3" fill="#450A0A" stroke="#EF4444" stroke-width="2" filter="url(#neonGlow)" />
      </g>
      <g transform="translate(40, 300)">
        <rect x="-35" y="-6" width="70" height="12" rx="3" fill="#450A0A" stroke="#EF4444" stroke-width="2" filter="url(#neonGlow)" />
      </g>
    </g>

    <!-- Lane 4: Plasma River (Vertical Rafts: Bottom -> Up) -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="110" height="400" rx="4" fill="url(#laneWater)" stroke="#0284C7" stroke-width="2" />
      <g stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="24 16" opacity="0.5">
        <line x1="25" y1="0" x2="25" y2="400" />
        <line x1="55" y1="0" x2="55" y2="400" />
        <line x1="85" y1="0" x2="85" y2="400" />
      </g>
      <use href="#energy-raft" x="55" y="80" />
      <!-- Active Raft Carrying the Shared Duo Character! -->
      <use href="#energy-raft" x="55" y="225" />
      <use href="#energy-raft" x="55" y="360" />
    </g>

    <!-- Lane 5: Cyber Highway 2 (Vertical Traffic: Bottom -> Up) -->
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="95" height="400" rx="4" fill="url(#laneRoad)" stroke="#1E293B" stroke-width="2" />
      <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="16 16" opacity="0.4">
        <line x1="47" y1="0" x2="47" y2="400" />
      </g>
      <use href="#cyber-car-up" x="47" y="130" />
      <use href="#cyber-car-up" x="47" y="330" />
    </g>

    <!-- Lane 6: Cyber Highway 3 (Vertical Traffic: Top -> Down) -->
    <g transform="translate(475, 0)">
      <rect x="0" y="0" width="95" height="400" rx="4" fill="url(#laneRoad)" stroke="#1E293B" stroke-width="2" />
      <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="16 16" opacity="0.4">
        <line x1="47" y1="0" x2="47" y2="400" />
      </g>
      <use href="#cyber-car-down" x="47" y="210" />
    </g>

    <!-- Lane 7: Safe Boundary Right (x=575) -->
    <g transform="translate(575, 0)">
      <rect x="0" y="0" width="105" height="400" rx="4" fill="url(#laneGrass)" stroke="#065F46" stroke-width="2" />
      <line x1="2" y1="0" x2="2" y2="400" stroke="#10B981" stroke-width="2" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- ========================================================
       SHARED CHARACTER IN THE MIDDLE (BEING CONTROLLED BILATERALLY)
       ======================================================== -->
  <g transform="translate(375, 290)">
    <!-- Active Bilateral Control Impulse Wave: P1 pushed RIGHT (Cyan arrow), P2 poises LEFT (Amber arrow) -->
    <use href="#shared-duo-hero" />

    <!-- Dual Trajectory Impulse Indicators -->
    <!-- P1 Impulse (Pushing Character RIGHT ->) -->
    <g transform="translate(-32, -4)" filter="url(#neonGlow)">
      <path d="M -16,0 L 0,0 M -6,-5 L 0,0 L -6,5" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-22" cy="0" r="3" fill="#38BDF8" />
    </g>
    <!-- P2 Impulse (Pushing Character LEFT <-) -->
    <g transform="translate(32, -4)" filter="url(#neonGlow)">
      <path d="M 16,0 L 0,0 M 6,-5 L 0,0 L 6,5" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="22" cy="0" r="3" fill="#F59E0B" />
    </g>

    <!-- Floating Co-op Sync Badge (+100 SYNC DODGE!) -->
    <g transform="translate(0, -44)" filter="url(#neonGlow)">
      <rect x="-44" y="-11" width="88" height="22" rx="11" fill="#0F172A" stroke="#6366F1" stroke-width="1.8" />
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#E0E7FF" text-anchor="middle">SYNC DODGE!</text>
    </g>
  </g>

  <!-- ========================================================
       BILATERAL TOUCH CONTROLS (SCREEN EDGES — EXACT MECHANIC)
       ======================================================== -->

  <!-- LEFT SCREEN EDGE: PLAYER 1 TOUCH ZONE (Tapping left pushes character RIGHT ->) -->
  <g transform="translate(25, 250)">
    <!-- Active Cyan Pulse Halo -->
    <rect x="-18" y="-75" width="36" height="150" rx="18" fill="url(#p1TouchGrad)" stroke="#06B6D4" stroke-width="2" filter="url(#neonGlow)" />
    <!-- P1 Touch Arrow & Label -->
    <g transform="translate(0, -15)">
      <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#38BDF8" text-anchor="middle">P1 TAP</text>
      <!-- Big Right Arrow -->
      <path d="M -8,0 L 6,0 M 0,-7 L 7,0 L 0,7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#67E8F9" text-anchor="middle">MOVES</text>
      <text x="0" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">RIGHT →</text>
    </g>
  </g>

  <!-- RIGHT SCREEN EDGE: PLAYER 2 TOUCH ZONE (Tapping right pushes character LEFT <-) -->
  <g transform="translate(775, 250)">
    <!-- Active Amber Pulse Halo -->
    <rect x="-18" y="-75" width="36" height="150" rx="18" fill="url(#p2TouchGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#neonGlow)" />
    <!-- P2 Touch Arrow & Label -->
    <g transform="translate(0, -15)">
      <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#FBBF24" text-anchor="middle">P2 TAP</text>
      <!-- Big Left Arrow -->
      <path d="M 8,0 L -6,0 M 0,-7 L -7,0 L 0,7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#FEF08A" text-anchor="middle">MOVES</text>
      <text x="0" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">← LEFT</text>
    </g>
  </g>

  <!-- ========================================================
       TOP HUD: COOPERATIVE DUO METRICS
       ======================================================== -->
  <g id="top-hud" transform="translate(400, 34)" filter="url(#dropShadow)">
    <rect x="-270" y="-18" width="540" height="38" rx="19" fill="#0F172A" fill-opacity="0.94" stroke="#1E293B" stroke-width="1.5" />

    <!-- Left: Stage Indicator -->
    <g transform="translate(-195, 2)">
      <circle cx="-12" cy="0" r="4.5" fill="#6366F1" filter="url(#neonGlow)" />
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="0.5">CROSSY DUO</text>
    </g>

    <!-- Center: Coordination Rate / Distance -->
    <g transform="translate(0, 2)">
      <line x1="-55" y1="-10" x2="-55" y2="10" stroke="#334155" stroke-width="1" />
      <rect x="-42" y="-9" width="84" height="18" rx="9" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#34D399" text-anchor="middle">SYNC: 95%</text>
      <line x1="55" y1="-10" x2="55" y2="10" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Right: Survived Time & Team Score -->
    <g transform="translate(170, 2)">
      <text x="-40" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" text-anchor="middle">01:12</text>
      <text x="35" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">12,850</text>
    </g>
  </g>
</svg>
