<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
    <radialGradient id="wheelCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Screen Bezel -->
  <rect x="24" y="20" width="752" height="460" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- In-Tool Interface Area (700 x 380, centered in 800 x 500) -->
  <rect x="50" y="60" width="700" height="380" rx="10" fill="rgba(11, 15, 25, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- MINIMALIST APPLICATION TOP BAR (height: 40px) -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="700" height="40" rx="10" fill="rgba(17, 24, 39, 0.85)" />
    <!-- Window dots -->
    <circle cx="24" cy="20" r="4.5" fill="#EF4444" opacity="0.7" />
    <circle cx="38" cy="20" r="4.5" fill="#F59E0B" opacity="0.7" />
    <circle cx="52" cy="20" r="4.5" fill="#10B981" opacity="0.7" />
    <!-- Tool Name -->
    <text x="350" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RULETA DIGITAL — CONTROL DE PREMIOS</text>
    <!-- Live Status Pill -->
    <rect x="606" y="9" width="76" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="620" cy="20" r="3" fill="#10B981" />
    <text x="650" y="23.5" fill="#6EE7B7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ONLINE</text>
  </g>

  <!-- MAIN TOOL CONTENT: ROULETTE WHEEL + SIDE PANEL (Available space: 700 x 340) -->
  <!-- Symmetrical layout: Left Margin 78px | Wheel (276px) | Gap 48px | Panel (220px) | Right Margin 78px -->
  <g transform="translate(50, 100)">
    <!-- Ambient Glow behind wheel -->
    <circle cx="216" cy="174" r="165" fill="url(#wheelCenterGlow)" />

    <!-- LEFT: THE ROULETTE WHEEL (Centered at x=216, y=174, outer r=138) -->
    <g transform="translate(216, 174)" filter="url(#shadow)">
      <!-- Outer Wheel Rim -->
      <circle cx="0" cy="0" r="138" fill="#1E293B" stroke="rgba(255, 255, 255, 0.16)" stroke-width="3" />
      <circle cx="0" cy="0" r="131" fill="#0F172A" stroke="#6366F1" stroke-width="2" />

      <!-- 8 Geometrical Wheel Slices (r=129, 129 * cos(45°) = 91.22) -->
      <!-- Slice 1 (0 to 45 deg) - Indigo -->
      <path d="M 0 0 L 129 0 A 129 129 0 0 1 91.22 91.22 Z" fill="#4338CA" opacity="0.9" />
      <!-- Slice 2 (45 to 90 deg) - Slate -->
      <path d="M 0 0 L 91.22 91.22 A 129 129 0 0 1 0 129 Z" fill="#1E293B" opacity="0.95" />
      <!-- Slice 3 (90 to 135 deg) - Cyan -->
      <path d="M 0 0 L 0 129 A 129 129 0 0 1 -91.22 91.22 Z" fill="#0891B2" opacity="0.9" />
      <!-- Slice 4 (135 to 180 deg) - Slate -->
      <path d="M 0 0 L -91.22 91.22 A 129 129 0 0 1 -129 0 Z" fill="#1E293B" opacity="0.95" />
      <!-- Slice 5 (180 to 225 deg) - Emerald -->
      <path d="M 0 0 L -129 0 A 129 129 0 0 1 -91.22 -91.22 Z" fill="#059669" opacity="0.9" />
      <!-- Slice 6 (225 to 270 deg) - Slate -->
      <path d="M 0 0 L -91.22 -91.22 A 129 129 0 0 1 0 -129 Z" fill="#1E293B" opacity="0.95" />
      <!-- Slice 7 (270 to 315 deg) - Amber Gold -->
      <path d="M 0 0 L 0 -129 A 129 129 0 0 1 91.22 -91.22 Z" fill="#D97706" opacity="0.92" />
      <!-- Slice 8 (315 to 360 deg) - Violet -->
      <path d="M 0 0 L 91.22 -91.22 A 129 129 0 0 1 129 0 Z" fill="#6D28D9" opacity="0.9" />

      <!-- Slice Separator Lines -->
      <circle cx="0" cy="0" r="129" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />
      <line x1="-129" y1="0" x2="129" y2="0" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
      <line x1="0" y1="-129" x2="0" y2="129" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
      <line x1="-91.22" y1="-91.22" x2="91.22" y2="91.22" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
      <line x1="-91.22" y1="91.22" x2="91.22" y2="-91.22" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />

      <!-- Perimeter Casino Pegs / Studs on Rim (r=133.5) -->
      <circle cx="133.5" cy="0" r="2.5" fill="#F8FAFC" />
      <circle cx="94.4" cy="94.4" r="2.5" fill="#F8FAFC" />
      <circle cx="0" cy="133.5" r="2.5" fill="#F8FAFC" />
      <circle cx="-94.4" cy="94.4" r="2.5" fill="#F8FAFC" />
      <circle cx="-133.5" cy="0" r="2.5" fill="#F8FAFC" />
      <circle cx="-94.4" cy="-94.4" r="2.5" fill="#F8FAFC" />
      <circle cx="0" cy="-133.5" r="2.5" fill="#F8FAFC" />
      <circle cx="94.4" cy="-94.4" r="2.5" fill="#F8FAFC" />

      <!-- Radially Centered Slice Labels along slice bisectors (r=84) -->
      <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
        <!-- Slice 8 (-22.5 deg) -->
        <g transform="rotate(-22.5)">
          <text x="84" y="3.5" text-anchor="middle">PREMIO 1</text>
        </g>
        <!-- Slice 1 (+22.5 deg) -->
        <g transform="rotate(22.5)">
          <text x="84" y="3.5" text-anchor="middle">DESCUENTO</text>
        </g>
        <!-- Slice 2 (+67.5 deg) -->
        <g transform="rotate(67.5)">
          <text x="84" y="3.5" text-anchor="middle" fill="#CBD5E1">SORPRESA</text>
        </g>
        <!-- Slice 7 (-67.5 deg) -->
        <g transform="rotate(-67.5)">
          <text x="84" y="3.5" text-anchor="middle">★ JACKPOT</text>
        </g>
        <!-- Slice 3 (112.5 deg -> rotated -67.5 with -x) -->
        <g transform="rotate(-67.5)">
          <text x="-84" y="3.5" text-anchor="middle">MERCH VIP</text>
        </g>
        <!-- Slice 4 (157.5 deg -> rotated -22.5 with -x) -->
        <g transform="rotate(-22.5)">
          <text x="-84" y="3.5" text-anchor="middle" fill="#CBD5E1">2x PUNTOS</text>
        </g>
        <!-- Slice 5 (202.5 deg -> rotated +22.5 with -x) -->
        <g transform="rotate(22.5)">
          <text x="-84" y="3.5" text-anchor="middle">KIT MARCA</text>
        </g>
        <!-- Slice 6 (247.5 deg -> rotated +67.5 with -x) -->
        <g transform="rotate(67.5)">
          <text x="-84" y="3.5" text-anchor="middle" fill="#CBD5E1">GIRO EXTRA</text>
        </g>
      </g>

      <!-- Center Hub -->
      <circle cx="0" cy="0" r="38" fill="#0B0F19" stroke="#6366F1" stroke-width="3" />
      <circle cx="0" cy="0" r="29" fill="#1E293B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
      <polygon points="0,-11 3,-3 11,-3 4.5,2 7,10 0,5.5 -7,10 -4.5,2 -11,-3 -3,-3" fill="#F59E0B" />

      <!-- Top Needle / Indicator (Fixed pointing down at 12 o'clock) -->
      <g transform="translate(0, -135)">
        <polygon points="0,17 -11,-9 11,-9" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
        <circle cx="0" cy="-4" r="3.5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- RIGHT: MINIMALIST CONTROL PANEL (x=402, y=36, width=220, height=276) -->
    <g transform="translate(402, 36)">
      <!-- Card Container -->
      <rect x="0" y="0" width="220" height="276" rx="10" fill="rgba(17, 24, 39, 0.8)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />

      <!-- Control Header -->
      <text x="110" y="30" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">PANEL DE CONTROL</text>
      <line x1="20" y1="44" x2="200" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <!-- Stat 1: Gajos -->
      <text x="20" y="70" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">Gajos activos:</text>
      <text x="200" y="70" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">8 gajos</text>

      <!-- Stat 2: Probabilidad -->
      <text x="20" y="98" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">Probabilidad:</text>
      <text x="200" y="98" fill="#34D399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">Ponderada ✓</text>

      <!-- Stat 3: Stock Premios -->
      <text x="20" y="126" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">Stock restante:</text>
      <text x="200" y="126" fill="#60A5FA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">142 un.</text>

      <!-- Divider -->
      <line x1="20" y1="146" x2="200" y2="146" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

      <!-- Big Minimalist Spin Button -->
      <g transform="translate(20, 164)">
        <rect x="0" y="0" width="180" height="44" rx="8" fill="#6366F1" />
        <text x="90" y="27" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" letter-spacing="1">GIRAR RULETA</text>
      </g>

      <!-- Secondary Auto-draw button -->
      <g transform="translate(20, 220)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="90" y="21.5" fill="#CBD5E1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Restablecer Stock</text>
      </g>
    </g>
  </g>
</svg>