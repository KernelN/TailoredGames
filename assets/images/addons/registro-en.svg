<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161E31" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="220" r="280" fill="url(#glow)"/>

  <!-- Device Frame Outline -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="70" y="50" width="660" height="400" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Top bar of the simulated device -->
  <rect x="70" y="50" width="660" height="42" rx="16" fill="rgba(11, 15, 25, 0.85)"/>
  <circle cx="95" cy="71" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="112" cy="71" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="129" cy="71" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="1">ADD-ON MODULE — LEAD CAPTURE</text>

  <!-- Icon Graphic: Emerald User Registration Form + Checkmark Badge -->
  <g transform="translate(400, 210) scale(1.1)">
    <!-- Form Card -->
    <rect x="-56" y="-62" width="112" height="106" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2.2"/>
    <!-- User Avatar Circle & Shoulders -->
    <circle cx="-26" cy="-34" r="10" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-width="2"/>
    <circle cx="-26" cy="-36" r="3.5" fill="#10B981"/>
    <path d="M -32 -27 C -32 -30 -20 -30 -20 -27" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <!-- Header Name Field -->
    <rect x="-8" y="-41" width="46" height="12" rx="3" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2"/>
    <line x1="-2" y1="-35" x2="28" y2="-35" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Input Field 1 (Email) -->
    <rect x="-38" y="-12" width="76" height="14" rx="3.5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <line x1="-30" y1="-5" x2="22" y2="-5" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Input Field 2 (Phone / Company) -->
    <rect x="-38" y="9" width="76" height="14" rx="3.5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <line x1="-30" y1="16" x2="10" y2="16" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Submit Pill -->
    <rect x="-38" y="29" width="46" height="8" rx="4" fill="#10B981"/>
    <!-- Verified Checkmark Badge -->
    <circle cx="48" cy="36" r="14" fill="#10B981" stroke="#0B0F19" stroke-width="3"/>
    <path d="M 42 36 L 46 40 L 55 31" fill="none" stroke="#0B0F19" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Titles -->
  <text x="400" y="360" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="-0.5">USER REGISTRATION</text>
  <text x="400" y="390" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.5">Lead Capture &amp; Database Export</text>

  <!-- Status Pill -->
  <rect x="330" y="415" width="140" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="345" cy="427" r="4" fill="#10B981"/>
  <text x="405" y="431" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EVENT-READY</text>
</svg>