<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotizador Online — Tailored Games | Presupuesto Interactivo para Eventos</title>
  <meta name="description" content="Calcula y cotiza en tiempo real los juegos interactivos y add-ons para tu evento corporativo con promociones por cantidad y duración." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-mode="cotizador">

  <!-- Header Mount -->
  <div id="header-mount"></div>

  <!-- Main Content -->
  <main class="container">
    <!-- Hero Section Mount -->
    <div id="hero-mount"></div>

    <!-- Promotional Highlight Banner -->
    <div id="promo-mount"></div>

    <!-- Two-Column Split Showcase: Clásicos | A Medida -->
    <div id="split-showcase-mount"></div>

    <!-- Agregados Showcase (4-Screenshot Grid) -->
    <div id="addons-mount"></div>

    <!-- Herramientas Showcase (Ruleta, Sorteador) -->
    <div id="tools-mount"></div>

    <!-- Campañas Especiales (Mi Gran Paseo) -->
    <div id="campaign-mount"></div>
  </main>

  <!-- Quoting Drawer Mount -->
  <div id="cart-mount"></div>

  <!-- Studio Contact Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="assets/js/data/catalog.js"></script>
  <script src="assets/js/modules/i18n.js"></script>
  <script src="assets/js/modules/cart.js"></script>
  <script src="assets/js/modules/carousel.js"></script>
  <script src="assets/js/modules/renderer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
