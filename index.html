<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corpfolio Studio — Experiencias Lúdicas e Interactivas para Eventos</title>
  <meta name="description" content="Juegos interactivos, pantallas táctiles y activaciones digitales de alto impacto para eventos corporativos, stands y marcas líderes." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-mode="showcase">

  <!-- Header Mount -->
  <div id="header-mount"></div>

  <!-- Main Content -->
  <main class="container">
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-badge">⚡ Experiencias B2B & Eventos Corporativos</div>
      <h1 class="hero-title">Juegos interactivos para tus eventos corporativos</h1>
      <p class="hero-subtitle">
        Llevamos dinámicas lúdicas de alto impacto a stands, activaciones de marca, jornadas de integración y fiestas de fin de año.
      </p>
    </section>

    <!-- Promotional Highlight Banner -->
    <div id="promo-mount"></div>

    <!-- Two-Column Split Showcase: Clásicos | A Medida -->
    <div id="split-showcase-mount"></div>

    <!-- Agregados Showcase (4-Screenshot Grid) -->
    <div id="addons-mount"></div>

    <!-- Herramientas Showcase (Ruleta, Sorteador) -->
    <div id="tools-mount"></div>

    <!-- Campañas Especiales (Mi Gran Paseo) -->
    <div id="campaign-mount"></div>
  </main>

  <!-- Studio Contact Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="assets/js/data/catalog.js"></script>
  <script src="assets/js/modules/i18n.js"></script>
  <script src="assets/js/modules/carousel.js"></script>
  <script src="assets/js/modules/renderer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
